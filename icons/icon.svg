<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect x="4" y="4" width="120" height="120" rx="24" ry="24" fill="url(#bgGrad)"/>
  <!-- Image frame -->
  <rect x="24" y="28" width="56" height="48" rx="6" ry="6" fill="none" stroke="white" stroke-width="4" opacity="0.9"/>
  <!-- Mountain in image -->
  <polygon points="28,72 44,50 56,64 64,54 76,72" fill="white" opacity="0.5"/>
  <!-- Sun in image -->
  <circle cx="38" cy="40" r="6" fill="white" opacity="0.5"/>
  <!-- Arrow curving back -->
  <path d="M82 44 Q100 30 100 56 Q100 80 72 84" stroke="white" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- Arrowhead -->
  <polygon points="72,76 64,86 76,90" fill="white" opacity="0.9"/>
  <!-- Text lines representing prompt -->
  <rect x="30" y="88" width="36" height="4" rx="2" fill="white" opacity="0.6"/>
  <rect x="30" y="96" width="48" height="4" rx="2" fill="white" opacity="0.6"/>
  <rect x="30" y="104" width="28" height="4" rx="2" fill="white" opacity="0.6"/>
</svg>
