<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Blocked — FocusGuard</title>
  <style>
    /* Classic Macintosh / System 7 Blocked Page */
    :root {
      --cream: #f5f0e1;
      --cream-dark: #e8e0cc;
      --black: #1a1a1a;
      --white: #fffef5;
      --border: 2px solid var(--black);
      --border-thin: 1px solid var(--black);
      --font: "Geneva", "ChicagoFLF", "Charcoal", "Lucida Grande", "Monaco", monospace;
      --shadow: 4px 4px 0 var(--black);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: var(--font);
      background: var(--cream);
      /* Classic Mac desktop pattern */
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent 0px, transparent 1px,
          rgba(0,0,0,0.03) 1px, rgba(0,0,0,0.03) 2px
        ),
        repeating-linear-gradient(
          90deg,
          transparent 0px, transparent 1px,
          rgba(0,0,0,0.03) 1px, rgba(0,0,0,0.03) 2px
        );
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--black);
      image-rendering: pixelated;
    }

    .container {
      text-align: center;
      max-width: 520px;
      padding: 30px 20px;
    }

    /* ── Classic Mac Window ───────────────────────── */

    .window {
      background: var(--white);
      border: var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .window-titlebar {
      display: flex;
      align-items: center;
      padding: 6px 10px;
      border-bottom: var(--border);
      background: var(--white);
      /* Classic horizontal lines pattern in titlebar */
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent 0px, transparent 2px,
          var(--cream-dark) 2px, var(--cream-dark) 3px
        );
    }

    .window-dots {
      display: flex;
      gap: 5px;
      margin-right: 10px;
    }

    .window-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: var(--border-thin);
      background: var(--white);
    }

    .window-dot:first-child {
      background: var(--black);
    }

    .window-title {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.5px;
      background: var(--white);
      padding: 0 8px;
    }

    .window-body {
      padding: 20px 24px 24px;
    }

    /* ── Animal Image ────────────────────────────── */

    .animal-frame {
      width: 260px;
      height: 195px;
      margin: 0 auto 6px;
      border: var(--border);
      overflow: hidden;
      position: relative;
      background: var(--cream-dark);
      /* Dithered loading pattern */
      background-image:
        repeating-linear-gradient(
          45deg,
          transparent 0px, transparent 2px,
          rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px
        );
    }

    .animal-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      /* Retro halftone feel */
      filter: contrast(1.1) saturate(0.3);
    }

    .animal-credit {
      font-size: 9px;
      color: #888;
      margin-bottom: 14px;
    }

    .animal-credit a {
      color: #666;
      text-decoration: none;
      border-bottom: 1px dotted #999;
    }

    /* ── Content ──────────────────────────────────── */

    h1 {
      font-size: 18px;
      font-weight: bold;
      color: var(--black);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .domain-name {
      font-size: 11px;
      color: #888;
      margin-bottom: 14px;
      word-break: break-all;
      font-family: "Monaco", monospace;
    }

    .domain-name strong {
      color: var(--black);
      font-weight: bold;
    }

    .caption {
      font-size: 14px;
      line-height: 1.5;
      color: var(--black);
      margin-bottom: 4px;
      font-weight: bold;
    }

    .subcaption {
      font-size: 11px;
      color: #666;
      font-style: italic;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .divider {
      height: 2px;
      margin: 14px 0;
      background:
        repeating-linear-gradient(
          90deg,
          var(--black) 0px, var(--black) 4px,
          transparent 4px, transparent 8px
        );
      opacity: 0.3;
    }

    /* ── Buttons ──────────────────────────────────── */

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .mac-btn {
      font-family: var(--font);
      font-size: 12px;
      font-weight: bold;
      padding: 7px 24px;
      border: var(--border);
      cursor: pointer;
      color: var(--black);
      background: var(--white);
      box-shadow: 2px 2px 0 var(--black);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-decoration: none;
      display: inline-block;
      transition: all 0.05s;
    }

    .mac-btn:active {
      background: var(--black);
      color: var(--white);
      box-shadow: none;
      transform: translate(2px, 2px);
    }

    .mac-btn-primary {
      background: var(--black);
      color: var(--white);
    }

    .mac-btn-primary:active {
      background: var(--white);
      color: var(--black);
    }

    .timer-info {
      margin-top: 14px;
      font-size: 11px;
      color: #666;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .timer-info strong {
      color: var(--black);
      font-family: "Monaco", monospace;
    }

    .hidden { display: none !important; }

    /* Loading state */
    .animal-frame.loading {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .animal-frame.loading::before {
      content: "[ loading... ]";
      font-size: 10px;
      color: #999;
      font-family: "Monaco", monospace;
      letter-spacing: 1px;
    }

    /* ── Dither border decoration at bottom ───────── */

    .window-footer {
      height: 6px;
      border-top: var(--border-thin);
      background:
        repeating-linear-gradient(
          90deg,
          var(--black) 0px, var(--black) 1px,
          var(--white) 1px, var(--white) 3px
        );
      opacity: 0.2;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="window">
      <!-- Classic Mac title bar -->
      <div class="window-titlebar">
        <div class="window-dots">
          <div class="window-dot"></div>
          <div class="window-dot"></div>
          <div class="window-dot"></div>
        </div>
        <span class="window-title">Site Blocked</span>
      </div>

      <div class="window-body">
        <!-- Animal Image -->
        <div class="animal-frame loading" id="animalFrame">
          <img id="animalImg" alt="Cute animal reminding you to stay focused" style="display:none">
        </div>
        <div class="animal-credit">
          Photo via <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a>
        </div>

        <h1>Nope. Not Today.</h1>
        <div class="domain-name">
          <strong id="blockedDomain"></strong> is on your block list.
        </div>

        <div class="caption" id="caption"></div>
        <div class="subcaption" id="subcaption"></div>

        <div class="divider"></div>

        <div class="actions">
          <a class="mac-btn mac-btn-primary" id="goBackBtn" href="#">Go Back</a>
          <a class="mac-btn" id="goHomeBtn" href="https://www.google.com">Search Instead</a>
        </div>

        <div class="timer-info hidden" id="timerInfo">
          Focus session active — <strong id="timerRemaining"></strong> remaining
        </div>
      </div>

      <div class="window-footer"></div>
    </div>
  </div>

  <script>
    // ── Cute Animal Images (Unsplash — royalty free) ──
    const ANIMALS = [
      {
        url: "https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=560&h=420&fit=crop",
        alt: "Golden retriever looking at you"
      },
      {
        url: "https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=560&h=420&fit=crop",
        alt: "Adorable golden retriever puppy"
      },
      {
        url: "https://images.unsplash.com/photo-1530281700549-e82e7bf110d6?w=560&h=420&fit=crop",
        alt: "Happy dog outdoors"
      },
      {
        url: "https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=560&h=420&fit=crop",
        alt: "Two dogs running joyfully"
      },
      {
        url: "https://images.unsplash.com/photo-1587402092301-725e37c70fd8?w=560&h=420&fit=crop",
        alt: "Cute puppy looking up"
      },
      {
        url: "https://images.unsplash.com/photo-1574158622682-e40e69881006?w=560&h=420&fit=crop",
        alt: "Cute little kitten"
      },
      {
        url: "https://images.unsplash.com/photo-1495360010541-f48722b34f7d?w=560&h=420&fit=crop",
        alt: "Orange kitten with big eyes"
      },
      {
        url: "https://images.unsplash.com/photo-1526336024174-e58f5cdd8e13?w=560&h=420&fit=crop",
        alt: "Cat looking up curiously"
      },
      {
        url: "https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=560&h=420&fit=crop",
        alt: "Cute cat lying down"
      },
      {
        url: "https://images.unsplash.com/photo-1606567595334-d39972c85dbe?w=560&h=420&fit=crop",
        alt: "Fluffy white kitten"
      },
      {
        url: "https://images.unsplash.com/photo-1452857297128-d9c29adba80b?w=560&h=420&fit=crop",
        alt: "Adorable bunny rabbit"
      },
      {
        url: "https://images.unsplash.com/photo-1425082661705-1834bfd09dca?w=560&h=420&fit=crop",
        alt: "Tiny hamster"
      },
      {
        url: "https://images.unsplash.com/photo-1535930749574-1399327ce78f?w=560&h=420&fit=crop",
        alt: "Cute cat with bright eyes"
      },
      {
        url: "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=560&h=420&fit=crop",
        alt: "Happy corgi smiling"
      },
      {
        url: "https://images.unsplash.com/photo-1586671267731-da2cf3ceeb80?w=560&h=420&fit=crop",
        alt: "Pug puppy with big eyes"
      },
      {
        url: "https://images.unsplash.com/photo-1518882174711-1de40238921b?w=560&h=420&fit=crop",
        alt: "Cute duckling"
      }
    ];

    // ── Snarky Captions (paired: headline + subtext) ──
    const CAPTIONS = [
      {
        caption: "This puppy believes in you. Don't let him down.",
        sub: "You blocked this site for a reason. Your future self is already proud."
      },
      {
        caption: "Look at this face. Now close the tab.",
        sub: "Every time you resist, a kitten earns its whiskers. Probably."
      },
      {
        caption: "You really thought you'd sneak past your own block list?",
        sub: "Bold move. But you set this up because you're smarter than your impulses."
      },
      {
        caption: "This little guy finished all his tasks today. Have you?",
        sub: "Get back to work and you can scroll guilt-free later."
      },
      {
        caption: "Plot twist: the real content was the productivity you gained along the way.",
        sub: "Your future self just sent a thank-you card from next week."
      },
      {
        caption: "Nice try. This site is in timeout.",
        sub: "Remember when you added it? That version of you was thinking clearly."
      },
      {
        caption: "This furball isn't judging you. Okay, maybe a little.",
        sub: "One habit at a time. Today, you chose focus. Good call."
      },
      {
        caption: "You vs. your distractions: 1-0. Keep the streak going.",
        sub: "Every block is a tiny win. Stack enough and you've got a great day."
      },
      {
        caption: "Even this hamster has more self-control than— wait, no, you do!",
        sub: "You literally built a system to keep yourself on track. That's elite."
      },
      {
        caption: "Somewhere, a motivational poster just got its wings.",
        sub: "You chose discipline over dopamine. That's not nothing."
      },
      {
        caption: "This site called. I told it you were busy being amazing.",
        sub: "Building good habits is just future you writing a five-star review of past you."
      },
      {
        caption: "Distraction blocked. Serotonin from productivity incoming.",
        sub: "The scroll can wait. Your goals can't."
      },
      {
        caption: "I'm not mad. I'm just disappointed. Actually no, I'm proud of you.",
        sub: "You set a boundary and you're honoring it. That takes guts."
      },
      {
        caption: "This bunny hopped in to say: stay on track, champ.",
        sub: "You didn't install a blocker to ignore it. Let's go."
      },
      {
        caption: "Your attention is worth more than whatever was on that site.",
        sub: "Protect your focus like this little one protects its treats."
      },
      {
        caption: "Access denied. Cuteness granted.",
        sub: "Think of this as a reward for your discipline, not a punishment."
      },
      {
        caption: "That site isn't going anywhere. But your momentum might.",
        sub: "Stay in the zone. You'll thank yourself at the end of the day."
      },
      {
        caption: "You came here looking for a distraction. Here's a better one.",
        sub: "Pet the screen if you must. Then get back to work."
      },
      {
        caption: "Breaking news: you chose yourself over mindless scrolling.",
        sub: "That's the headline. Everything else is noise."
      },
      {
        caption: "This duck thinks you're doing great. Don't prove it wrong.",
        sub: "Small wins compound. This moment right here? That's compound interest."
      }
    ];

    // ── Pick random image + caption ──
    const animalIdx = Math.floor(Math.random() * ANIMALS.length);
    const captionIdx = Math.floor(Math.random() * CAPTIONS.length);

    const animal = ANIMALS[animalIdx];
    const chosen = CAPTIONS[captionIdx];

    // ── Set content ──
    const params = new URLSearchParams(window.location.search);
    const domain = params.get("domain") || "this site";

    document.getElementById("blockedDomain").textContent = domain;
    document.getElementById("caption").textContent = chosen.caption;
    document.getElementById("subcaption").textContent = chosen.sub;

    // Load image
    const img = document.getElementById("animalImg");
    const frame = document.getElementById("animalFrame");

    img.onload = function() {
      frame.classList.remove("loading");
      img.style.display = "block";
    };

    img.onerror = function() {
      frame.style.display = "none";
    };

    img.src = animal.url;
    img.alt = animal.alt;

    // ── Navigation ──
    document.getElementById("goBackBtn").addEventListener("click", (e) => {
      e.preventDefault();
      if (history.length > 1) history.back();
      else window.location.href = "https://www.google.com";
    });

    // ── Focus session timer ──
    chrome.runtime.sendMessage({ type: "GET_STATE" }, (res) => {
      if (res && res.state && res.state.focusSession) {
        const remaining = Math.max(0, res.state.focusSession.endTime - Date.now());
        if (remaining > 0) {
          const mins = Math.ceil(remaining / 60000);
          document.getElementById("timerRemaining").textContent =
            mins > 60 ? `${Math.floor(mins/60)}h ${mins%60}m` : `${mins}m`;
          document.getElementById("timerInfo").classList.remove("hidden");
        }
      }
    });

    // Record the block
    chrome.runtime.sendMessage({ type: "RECORD_BLOCK" });
  </script>
</body>
</html>
