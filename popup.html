<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reverse Image Prompt</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="header-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="12" height="10" rx="2"/>
          <path d="M15 8 Q19 5 19 11 Q19 17 13 18"/>
          <polygon points="13,15 10,19 14,20"/>
        </svg>
      </div>
      <span class="header-title">Reverse Image Prompt</span>
      <button id="settingsBtn" class="header-settings" title="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </div>

    <div class="body">
      <!-- Empty state -->
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="8" width="24" height="20" rx="3"/>
            <polygon points="10,24 18,16 24,20 28,15 30,24" fill="#444" opacity="0.3"/>
            <circle cx="14" cy="14" r="2" fill="#555" opacity="0.4"/>
            <path d="M32 14 Q40 8 40 20 Q40 32 28 34"/>
            <polygon points="28,28 24,36 30,38" fill="#555" opacity="0.5"/>
          </svg>
        </div>
        <p class="empty-title">Right-click any image</p>
        <p class="empty-desc">Select "Reverse Image Prompt" from the context menu to generate an AI prompt for any image online.</p>
      </div>

      <!-- Result state -->
      <div id="resultState" class="result-state hidden">
        <img id="resultImage" class="result-image" alt="Analyzed image" />
        <div class="result-label">Generated Prompt</div>
        <div id="resultBox" class="result-box"></div>
        <div class="result-actions">
          <button id="copyBtn" class="btn btn-primary">Copy Prompt</button>
        </div>
        <div id="copiedMsg" class="copied-msg">Copied!</div>
      </div>

      <!-- Loading state -->
      <div id="loadingState" class="loading-state hidden">
        <div class="spinner"></div>
        <p>Analyzing image...</p>
      </div>

      <!-- Error state -->
      <div id="errorState" class="error-state hidden">
        <div class="error-box" id="errorMsg"></div>
        <button id="retryBtn" class="btn btn-secondary">Retry</button>
      </div>
    </div>

    <div class="footer">
      <span class="footer-hint">Provider: <span id="providerName">Not configured</span></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
